<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 580" width="1060" height="580" role="img" aria-label="Where each part of the Phase 1 record comes from. admin.json, the hubverse standard column definitions, target-data.json and tasks.json are read automatically and fill the dataset identity and most of the data dictionary. The admin supplies only the description, license and keywords, and completes the scaffolded hub-metadata.json entries for custom task IDs and pmf and cdf categories. Step 3 renders the record as a page." font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#1f2328"/>
    </marker>
  </defs>

  <rect width="1060" height="580" fill="#ffffff"/>

  <!-- Column titles -->
  <text x="140" y="22" text-anchor="middle" font-weight="600" font-size="13">Sources</text>
  <text x="795" y="22" text-anchor="middle" font-weight="600" font-size="13">Metadata record (JSON-LD)</text>

  <!-- Sources -->
  <g stroke="#1f2328" fill="#ffffff">
    <rect x="30" y="66" width="220" height="32" rx="4"/>
    <rect x="30" y="199" width="220" height="32" rx="4"/>
    <rect x="30" y="236" width="220" height="32" rx="4"/>
    <rect x="30" y="280" width="220" height="40" rx="4"/>
  </g>
  <rect x="30" y="109" width="220" height="32" rx="16" fill="#ffffff" stroke="#1f2328" stroke-dasharray="5 4"/>
  <rect x="30" y="365" width="220" height="32" rx="4" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="140" y="86">admin.json</text>
    <text x="140" y="129">Hub admin</text>
    <text x="140" y="219" font-size="11">hubverse standard column definitions</text>
    <text x="140" y="256">target-data.json</text>
    <text x="140" y="297">tasks.json</text>
    <text x="140" y="312" fill="#57606a" font-size="11">incl. target_metadata</text>
    <text x="140" y="385" fill="#0969da" font-weight="600">hub-metadata.json (new)</text>
  </g>
  <text x="30" y="414" fill="#57606a" font-size="11">entries scaffolded by tooling,</text>
  <text x="30" y="428" fill="#57606a" font-size="11">completed by the admin</text>

  <!-- Record: step bands -->
  <g fill="#f6f8fa" stroke="#d0d7de">
    <rect x="540" y="36" width="510" height="124" rx="6"/>
    <rect x="540" y="172" width="510" height="268" rx="6"/>
    <rect x="540" y="452" width="510" height="72" rx="6"/>
  </g>
  <g font-weight="600">
    <text x="556" y="54">Step 1: dataset-level record</text>
    <text x="556" y="190">Step 2: per-column data dictionary</text>
    <text x="556" y="470">Step 3: human-readable output</text>
  </g>

  <!-- Record: rows -->
  <g fill="#ffffff" stroke="#1f2328">
    <rect x="560" y="67" width="476" height="30" rx="4"/>
    <rect x="560" y="200" width="476" height="30" rx="4"/>
    <rect x="560" y="237" width="476" height="30" rx="4"/>
    <rect x="560" y="274" width="476" height="30" rx="4"/>
    <rect x="560" y="311" width="476" height="30" rx="4"/>
    <rect x="560" y="348" width="476" height="30" rx="4"/>
    <rect x="560" y="385" width="476" height="30" rx="4"/>
    <rect x="560" y="485" width="476" height="30" rx="4"/>
  </g>
  <rect x="560" y="110" width="476" height="30" rx="4" fill="#ffffff" stroke="#1f2328" stroke-dasharray="5 4"/>
  <g>
    <text x="572" y="86">name, maintainer, contact, citation, repository, file formats</text>
    <text x="572" y="129">description, license, keywords</text>
    <text x="572" y="219">descriptions of standard task ID and representation columns</text>
    <text x="572" y="256">every column's name and type</text>
    <text x="572" y="293">target values, and the units of <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">value</tspan> for each target</text>
    <text x="572" y="330"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">output_type_id</tspan> entries: quantile levels, cdf values, sample structure</text>
    <text x="572" y="367">custom task IDs: type, description, values</text>
    <text x="572" y="404">pmf and cdf categories: descriptions, schemes</text>
    <text x="572" y="504">data dictionary and landing page</text>
  </g>

  <!-- Automatic arrows -->
  <g fill="none" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="250" y1="82" x2="560" y2="82"/>
    <line x1="250" y1="215" x2="560" y2="215"/>
    <line x1="250" y1="250" x2="560" y2="248"/>
    <line x1="250" y1="292" x2="560" y2="257"/>
    <line x1="250" y1="300" x2="560" y2="289"/>
    <line x1="250" y1="308" x2="560" y2="326"/>
    <line x1="250" y1="376" x2="560" y2="363"/>
    <line x1="250" y1="386" x2="560" y2="400"/>
    <!-- Steps 1 and 2 rendered as Step 3 -->
    <line x1="1000" y1="440" x2="1000" y2="485"/>
  </g>
  <text x="992" y="466" text-anchor="end" fill="#57606a" font-size="11">renders</text>

  <!-- Admin-supplied arrows -->
  <g fill="none" stroke="#1f2328" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)">
    <line x1="250" y1="125" x2="560" y2="125"/>
    <path d="M 30 125 H 14 V 381 H 30"/>
  </g>

  <!-- Legend -->
  <g font-size="11" fill="#57606a">
    <line x1="30" y1="556" x2="70" y2="556" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="80" y="560">read automatically by extract_metadata()</text>
    <line x1="330" y1="556" x2="370" y2="556" stroke="#1f2328" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="380" y="560">supplied by the admin</text>
    <rect x="540" y="548" width="24" height="16" rx="3" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
    <text x="572" y="560">new config file</text>
  </g>
</svg>
